<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Manutenção · Casas de Oração</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --primary: #2c3e50; --accent: #3498db; --danger: #e74c3c; --success: #2ecc71;
            --bg: #f5f7fa; --text: #333; --white: #fff; --border: #dcdde1;
            --radius: 12px; --shadow: 0 2px 10px rgba(0,0,0,0.05);
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg); color: var(--text); padding-bottom: 70px; overflow-x: hidden;
        }
        .container { max-width: 500px; margin: 0 auto; padding: 20px 16px; }
        h2 { margin-bottom: 16px; font-size: 1.4rem; }
        .bottom-menu {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: var(--white); border-top: 1px solid var(--border);
            display: flex; justify-content: space-around; align-items: center;
            padding: 10px 0; z-index: 1000; box-shadow: 0 -2px 5px rgba(0,0,0,0.05);
        }
        .menu-item {
            display: flex; flex-direction: column; align-items: center;
            font-size: 0.7rem; color: var(--text); cursor: pointer; border: none; background: none;
        }
        .menu-item.active { color: var(--accent); font-weight: bold; }
        .card {
            background: var(--white); border-radius: var(--radius);
            padding: 16px; margin-bottom: 16px; box-shadow: var(--shadow);
        }
        .btn {
            display: inline-flex; align-items: center; justify-content: center;
            padding: 12px 24px; border: none; border-radius: 30px;
            font-size: 1rem; cursor: pointer; transition: 0.2s; margin: 4px;
        }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-success { background: var(--success); color: #fff; }
        .btn-small { padding: 6px 12px; font-size: 0.85rem; }
        input, select, textarea {
            width: 100%; padding: 12px; margin: 8px 0 16px;
            border: 1px solid var(--border); border-radius: 8px; font-size: 1rem;
        }
        label { font-weight: 500; display: block; margin-top: 12px; }
        #login-screen { display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .login-box {
            background: white; padding: 30px; border-radius: var(--radius);
            box-shadow: var(--shadow); width: 100%; max-width: 380px;
        }
        .login-box h1 { text-align: center; margin-bottom: 20px; }
        .domain-hint { font-size: 0.9rem; color: #888; margin-bottom: 20px; }
        .toast {
            position: fixed; top: 20px; right: 20px; z-index: 2000;
            padding: 12px 24px; border-radius: 30px; color: white; font-weight: 500;
            animation: slideIn 0.3s ease;
        }
        .toast-info { background: var(--accent); }
        .toast-success { background: var(--success); }
        .toast-error { background: var(--danger); }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
        .hidden { display: none !important; }
        .mt-2 { margin-top: 16px; }
        img.preview { max-width: 120px; border-radius: 8px; margin-top: 8px; }
        @media (min-width: 768px) { .container { max-width: 800px; } }
    </style>
</head>
<body>
    <div id="login-screen">
        <div class="login-box">
            <h1>🔑 Acesso</h1>
            <form id="login-form">
                <label for="username">Nome de usuário</label>
                <input type="text" id="username" placeholder="ex: eliesermusicoccb" required autocomplete="username">
                <div class="domain-hint">@ccbtorrinha.com.br adicionado automaticamente</div>
                <label for="password">Senha</label>
                <input type="password" id="password" required autocomplete="current-password">
                <button type="submit" class="btn btn-primary" style="width:100%">Entrar</button>
            </form>
            <p id="login-error" style="color:red; margin-top:12px;"></p>
        </div>
    </div>

    <div id="app-screen" class="hidden">
        <div class="container" id="app-content"></div>
        <nav class="bottom-menu" id="bottom-menu">
            <button class="menu-item" data-page="dashboard">🏠 Início</button>
            <button class="menu-item" data-page="ocorrencias">⚠️ Ocorrências</button>
            <button class="menu-item" data-page="manutencao">🔧 Manutenção</button>
            <button class="menu-item" data-page="chat">💬 Chat</button>
            <button class="menu-item hidden admin-only" data-page="admin">⚙️ Admin</button>
        </nav>
    </div>

    <script>
        // =====================================================
        // CONFIGURAÇÃO DO SUPABASE
        // =====================================================
        const SUPABASE_URL = 'https://ybsqrvtmhfhxjegenzgw.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlic3FydnRtaGZoeGplZ2Vuemd3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3Mjk3NzAsImV4cCI6MjA5NTMwNTc3MH0.ODE4fv9OReGht0xAbl82kTg0hkMb6dQO9ZhHqWcI7u8';
        const DOMINIO_EMAIL = '@ccbtorrinha.com.br';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // =====================================================
        // ESTADO GLOBAL
        // =====================================================
        let session = null;
        let profile = null;
        let currentPage = 'dashboard';

        // =====================================================
        // UTILITÁRIOS
        // =====================================================
        function formatDate(dateStr) { return dateStr ? new Date(dateStr).toLocaleDateString('pt-BR') : ''; }
        function formatDateTime(dateStr) { return dateStr ? new Date(dateStr).toLocaleString('pt-BR') : ''; }
        function showToast(msg, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // =====================================================
        // AUTENTICAÇÃO
        // =====================================================
        async function login(username, password) {
            const email = username.trim().toLowerCase() + DOMINIO_EMAIL;
            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) throw error;
            return data;
        }
        async function logout() {
            await supabase.auth.signOut();
            session = null; profile = null;
            document.getElementById('login-screen').classList.remove('hidden');
            document.getElementById('app-screen').classList.add('hidden');
        }
        async function loadSession() {
            const { data } = await supabase.auth.getSession();
            session = data.session;
            if (session) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('app-screen').classList.remove('hidden');
                await loadProfile();
                renderBottomMenu();
                navigateTo('dashboard');
            }
        }
        async function loadProfile() {
            if (!session) return;
            const { data, error } = await supabase
                .from('profiles').select('*, cities(name), houses(name)').eq('id', session.user.id).single();
            if (error) throw error;
            profile = data;
            document.querySelectorAll('.admin-only').forEach(el => el.classList.toggle('hidden', profile.role !== 'Administrador'));
        }
        function isAdmin() { return profile?.role === 'Administrador'; }
        function isGestorOuAdmin() { return profile?.role === 'Gestor da Manutenção' || isAdmin(); }
        function getVisibilityFilter() {
            if (!profile) return {};
            if (profile.permission_level === 'house') return { house_id: profile.house_id, city_id: profile.city_id };
            if (profile.permission_level === 'city') return { city_id: profile.city_id };
            return {};
        }

        // =====================================================
        // NAVEGAÇÃO SPA
        // =====================================================
        function navigateTo(page) {
            currentPage = page;
            document.querySelectorAll('.menu-item').forEach(b => b.classList.toggle('active', b.dataset.page === page));
            renderPage(page);
        }
        async function renderPage(page) {
            const appContent = document.getElementById('app-content');
            if (!profile) await loadProfile();
            switch (page) {
                case 'dashboard': renderDashboard(appContent); break;
                case 'ocorrencias': renderOcorrencias(appContent); break;
                case 'manutencao': renderManutencao(appContent); break;
                case 'cronograma': renderCronograma(appContent); break;
                case 'tarefas': renderTarefas(appContent); break;
                case 'estoque': renderEstoque(appContent); break;
                case 'chat': renderChat(appContent); break;
                case 'admin': if (isAdmin()) renderAdmin(appContent); else navigateTo('dashboard'); break;
                default: renderDashboard(appContent);
            }
        }

        function renderBottomMenu() {
            document.querySelectorAll('.menu-item').forEach(btn => {
                btn.addEventListener('click', () => navigateTo(btn.dataset.page));
            });
        }

        // =====================================================
        // PÁGINAS
        // =====================================================
        function renderDashboard(container) {
            container.innerHTML = `<h2>Bem-vindo(a) ${profile.full_name}</h2>
                <div class="card">
                    <p>🏠 <strong>${profile.houses?.name || 'Casa não definida'}</strong></p>
                    <p>📋 Ocorrências ativas: <span id="count-ocorrencias">...</span></p>
                    <p>📦 Estoque baixo: <span id="count-stock">...</span></p>
                </div>`;
            carregarResumo();
        }
        async function carregarResumo() {
            const filter = getVisibilityFilter();
            const { count: occCount } = await supabase.from('occurrences').select('*', { count: 'exact', head: true }).match(filter).not('status', 'in', '("CONCLUIDA","CANCELADA")');
            document.getElementById('count-ocorrencias').textContent = occCount || 0;
            const { data: stock } = await supabase.from('stock_items').select('*').match(filter);
            const low = stock?.filter(i => i.quantity <= i.min_stock).length || 0;
            document.getElementById('count-stock').textContent = low;
        }

        const LOCAIS_COM_LADO = ['Corredor','Sanitários','Vestiários','Marquise'];
        function renderOcorrencias(container) {
            container.innerHTML = `<h2>📌 Registrar Ocorrência</h2>
                <form id="form-ocorrencia">
                    <label>Data</label><input type="date" id="data-oc" disabled>
                    <label>Local</label><select id="local-oc" required><option value="">Selecione...</option>
                        <option>Tanque de batismo</option><option>Púlpito</option><option>Nave</option>
                        <option>Marquise</option><option>Entrada principal</option><option>Porão</option>
                        <option>Fundos</option><option>Sanitários</option><option>Vestiários</option>
                        <option>Corredor</option><option>Sala administrativa</option><option>Sala da piedade</option>
                        <option>Escadas</option><option>Outros</option></select>
                    <div id="lado-group" style="display:none"><label>Lado</label><select id="lado-oc">
                        <option value="Lado dos irmãos">Lado dos irmãos</option>
                        <option value="Lado das irmãs">Lado das irmãs</option></select></div>
                    <label>Descrição do problema</label><textarea id="descricao-oc" rows="3" required></textarea>
                    <label>Foto/Vídeo</label><input type="file" id="arquivo-oc" accept="image/*,video/*">
                    <button type="submit" class="btn btn-primary">Registrar</button>
                </form>
                <hr class="mt-2"><h2>📋 Ocorrências Registradas</h2><div id="lista-ocorrencias">Carregando...</div>`;
            document.getElementById('data-oc').value = new Date().toISOString().split('T')[0];
            document.getElementById('local-oc').addEventListener('change', e => {
                document.getElementById('lado-group').style.display = LOCAIS_COM_LADO.includes(e.target.value) ? 'block' : 'none';
            });
            document.getElementById('form-ocorrencia').addEventListener('submit', async (e) => {
                e.preventDefault();
                const local = document.getElementById('local-oc').value;
                const lado = LOCAIS_COM_LADO.includes(local) ? document.getElementById('lado-oc').value : null;
                const descricao = document.getElementById('descricao-oc').value;
                const arquivo = document.getElementById('arquivo-oc').files[0];
                let attachment_url = null;
                if (arquivo) {
                    const fileName = `ocorrencias/${profile.house_id}_${Date.now()}`;
                    const { error: upErr } = await supabase.storage.from('occurrences').upload(fileName, arquivo);
                    if (upErr) return showToast('Erro upload: ' + upErr.message, 'error');
                    attachment_url = supabase.storage.from('occurrences').getPublicUrl(fileName).data.publicUrl;
                }
                const { error } = await supabase.from('occurrences').insert({
                    city_id: profile.city_id, house_id: profile.house_id,
                    location: local, side: lado, description: descricao,
                    attachment_url, created_by: profile.id
                });
                if (error) showToast('Erro: ' + error.message, 'error');
                else {
                    showToast('Ocorrência registrada!', 'success');
                    document.getElementById('form-ocorrencia').reset();
                    document.getElementById('data-oc').value = new Date().toISOString().split('T')[0];
                    carregarListaOcorrencias();
                }
            });
            carregarListaOcorrencias();
        }
        async function carregarListaOcorrencias() {
            const filter = getVisibilityFilter();
            const { data, error } = await supabase.from('occurrences').select('*').match(filter).order('created_at', { ascending: false });
            const container = document.getElementById('lista-ocorrencias');
            if (error) { container.innerHTML = '<p>Erro ao carregar.</p>'; return; }
            if (!data.length) { container.innerHTML = '<p>Nenhuma ocorrência.</p>'; return; }
            container.innerHTML = data.map(occ => `
                <div class="card">
                    <p><strong>${formatDateTime(occ.created_at)}</strong></p>
                    <p>📍 ${occ.location}${occ.side ? ' - '+occ.side : ''}</p>
                    <p>${occ.description}</p>
                    ${occ.attachment_url ? `<img src="${occ.attachment_url}" class="preview">` : ''}
                    <p><small>Status: ${occ.status}</small></p>
                </div>`).join('');
        }

        function renderManutencao(container) {
            if (!isGestorOuAdmin()) { container.innerHTML = '<p>Sem permissão.</p>'; return; }
            container.innerHTML = `<h2>🔧 Gestão de Manutenção</h2><div id="manut-ocorrencias"></div>`;
            carregarOcorrenciasParaManutencao();
        }
        async function carregarOcorrenciasParaManutencao() {
            const filter = getVisibilityFilter();
            const { data } = await supabase.from('occurrences').select('*').match(filter).neq('status', 'CONCLUIDA').order('created_at', { ascending: false });
            const container = document.getElementById('manut-ocorrencias');
            if (!data.length) { container.innerHTML = '<p>Nenhuma pendente.</p>'; return; }
            container.innerHTML = data.map(occ => `
                <div class="card" style="cursor:pointer" onclick="abrirManutencao(${occ.id})">
                    <p><strong>${formatDate(occ.created_at)}</strong> - ${occ.location}</p>
                    <p>${occ.description.substring(0,60)}...</p><small>Status: ${occ.status}</small>
                </div>`).join('');
        }
        window.abrirManutencao = async function(occId) {
            const { data: occ } = await supabase.from('occurrences').select('*').eq('id', occId).single();
            const modal = document.createElement('div');
            modal.innerHTML = `<div class="modal-content card" style="max-height:90vh;overflow-y:auto;">
                <h3>Ocorrência #${occ.id}</h3><p><strong>Local:</strong> ${occ.location} ${occ.side||''}</p><p>${occ.description}</p>
                <form id="form-manutencao">
                    <label>Categoria</label><input id="cat-manut">
                    <label>Prioridade</label><select id="prio-manut"><option>baixa</option><option>média</option><option>alta</option><option>urgente</option></select>
                    <label>Responsável</label><select id="resp-manut"></select>
                    <label>Fornecedor</label><input id="forn-manut">
                    <label>Data prevista</label><input type="date" id="data-prev">
                    <label>Data execução</label><input type="date" id="data-exec">
                    <label>Custo previsto</label><input type="number" step="0.01" id="custo-prev">
                    <label>Custo realizado</label><input type="number" step="0.01" id="custo-real">
                    <label>Progresso (%)</label><input type="number" min="0" max="100" id="prog-manut" value="0">
                    <label>Observações</label><textarea id="obs-manut" rows="2"></textarea>
                    <button type="submit" class="btn btn-primary">Salvar Plano</button>
                </form>
                <button class="btn btn-small mt-2" onclick="this.parentElement.parentElement.remove()">Fechar</button>
            </div>`;
            document.body.appendChild(modal);
            const { data: users } = await supabase.from('profiles').select('id, full_name');
            const selectResp = modal.querySelector('#resp-manut');
            users.forEach(u => selectResp.innerHTML += `<option value="${u.id}">${u.full_name}</option>`);
            modal.querySelector('#form-manutencao').addEventListener('submit', async (e) => {
                e.preventDefault();
                const f = e.target;
                const { error } = await supabase.from('maintenance_plans').insert({
                    occurrence_id: occ.id, category: f['cat-manut'].value, priority: f['prio-manut'].value,
                    responsible: f['resp-manut'].value || null, supplier: f['forn-manut'].value,
                    planned_date: f['data-prev'].value || null, execution_date: f['data-exec'].value || null,
                    estimated_cost: parseFloat(f['custo-prev'].value) || 0, actual_cost: parseFloat(f['custo-real'].value) || 0,
                    progress: parseInt(f['prog-manut'].value) || 0, notes: f['obs-manut'].value,
                    status: 'EM_ANALISE', city_id: occ.city_id, house_id: occ.house_id
                });
                if (error) showToast('Erro: ' + error.message, 'error');
                else { showToast('Plano criado!', 'success'); modal.remove(); carregarOcorrenciasParaManutencao(); }
            });
        };

        function renderChat(container) {
            container.innerHTML = `<h2>💬 Chat da Casa</h2>
                <div id="chat-messages" class="card" style="max-height:50vh;overflow-y:auto;min-height:200px;"></div>
                <form id="form-chat" class="mt-2"><input id="msg-input" placeholder="Mensagem..." required><button class="btn btn-primary">Enviar</button></form>`;
            carregarMensagens();
            configurarChatRealtime();
            document.getElementById('form-chat').addEventListener('submit', enviarMensagem);
        }
        async function carregarMensagens() {
            const filter = getVisibilityFilter();
            let q = supabase.from('chat_messages').select('*, sender:profiles(full_name, role)');
            if (filter.house_id) q = q.eq('house_id', filter.house_id); else if (filter.city_id) q = q.eq('city_id', filter.city_id);
            const { data } = await q.order('created_at', { ascending: true });
            const c = document.getElementById('chat-messages');
            if (!data) return;
            c.innerHTML = data.map(m => `<p><strong>${m.sender?.full_name||'?'}</strong> (${m.sender?.role||''}): ${m.message} <small>${formatDateTime(m.created_at)}</small></p>`).join('');
            c.scrollTop = c.scrollHeight;
        }
        function configurarChatRealtime() {
            const filter = getVisibilityFilter();
            supabase.channel('chat-channel')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chat_messages', filter: filter.house_id ? `house_id=eq.${filter.house_id}` : filter.city_id ? `city_id=eq.${filter.city_id}` : undefined }, () => carregarMensagens())
                .subscribe();
        }
        async function enviarMensagem(e) {
            e.preventDefault();
            const input = document.getElementById('msg-input'); const msg = input.value.trim(); if (!msg) return;
            const filter = getVisibilityFilter();
            await supabase.from('chat_messages').insert({ sender_id: profile.id, city_id: filter.city_id || null, house_id: filter.house_id || null, message: msg });
            input.value = ''; carregarMensagens();
        }

        function renderAdmin(container) {
            container.innerHTML = `<h2>⚙️ Administração</h2>
                <button class="btn btn-small" onclick="adminUsuarios()">👥 Usuários</button>
                <button class="btn btn-small" onclick="adminCidades()">🏙️ Cidades</button>
                <button class="btn btn-small" onclick="adminCasas()">🏠 Casas</button>
                <div id="admin-content" class="mt-2"></div>`;
        }
        window.adminUsuarios = async function() {
            const { data: users } = await supabase.from('profiles').select('*');
            const container = document.getElementById('admin-content');
            container.innerHTML = `<h3>Usuários</h3>` + users.map(u => `
                <div class="card">
                    <p>${u.full_name} (@${u.username}) - ${u.role}</p>
                    <select onchange="updateUser('${u.id}','role',this.value)">
                        <option ${u.role==='Usuário'?'selected':''}>Usuário</option>
                        <option ${u.role==='Cooperador'?'selected':''}>Cooperador</option>
                        <option ${u.role==='Diácono'?'selected':''}>Diácono</option>
                        <option ${u.role==='Ancião'?'selected':''}>Ancião</option>
                        <option ${u.role==='Gestor da Manutenção'?'selected':''}>Gestor da Manutenção</option>
                        <option ${u.role==='Administrador'?'selected':''}>Administrador</option>
                    </select>
                    <select onchange="updateUser('${u.id}','permission_level',this.value)">
                        <option value="house" ${u.permission_level==='house'?'selected':''}>House</option>
                        <option value="city" ${u.permission_level==='city'?'selected':''}>City</option>
                        <option value="all" ${u.permission_level==='all'?'selected':''}>All</option>
                    </select>
                    <button class="btn btn-small btn-danger" onclick="deleteUser('${u.id}')">🗑️</button>
                </div>`).join('');
        };
        window.updateUser = async (id, field, value) => { await supabase.from('profiles').update({ [field]: value }).eq('id', id); showToast('Atualizado!', 'success'); adminUsuarios(); };
        window.deleteUser = async (id) => { if (confirm('Excluir?')) { await supabase.from('profiles').delete().eq('id', id); showToast('Removido.'); adminUsuarios(); } };
        window.adminCidades = async function() {
            const { data: cities } = await supabase.from('cities').select('*');
            document.getElementById('admin-content').innerHTML = `<h3>Cidades</h3><input id="nova-cidade" placeholder="Nova cidade"><button class="btn btn-small" onclick="addCidade()">Adicionar</button><hr>` + cities.map(c => `<p>${c.name} <button class="btn btn-small btn-danger" onclick="delCidade(${c.id})">X</button></p>`).join('');
        };
        window.addCidade = async () => { const n = document.getElementById('nova-cidade').value.trim(); if(n) { await supabase.from('cities').insert({ name: n }); adminCidades(); } };
        window.delCidade = async (id) => { await supabase.from('cities').delete().eq('id',id); adminCidades(); };
        window.adminCasas = async function() {
            const { data: houses } = await supabase.from('houses').select('*, cities(name)');
            const { data: cities } = await supabase.from('cities').select('*');
            document.getElementById('admin-content').innerHTML = `<h3>Casas</h3><select id="cidade-casa">` + cities.map(c => `<option value="${c.id}">${c.name}</option>`).join('') + `</select><input id="nova-casa" placeholder="Nome"><button class="btn btn-small" onclick="addCasa()">Adicionar</button><hr>` + houses.map(h => `<p>${h.name} (${h.cities?.name}) <button class="btn btn-small btn-danger" onclick="delCasa(${h.id})">X</button></p>`).join('');
        };
        window.addCasa = async () => { const n = document.getElementById('nova-casa').value.trim(); const cid = parseInt(document.getElementById('cidade-casa').value); if(n) { await supabase.from('houses').insert({ name: n, city_id: cid }); adminCasas(); } };
        window.delCasa = async (id) => { await supabase.from('houses').delete().eq('id',id); adminCasas(); };

        function renderCronograma(c) { c.innerHTML = '<h2>📅 Cronograma</h2><p>Em desenvolvimento.</p>'; }
        function renderTarefas(c) { c.innerHTML = '<h2>🔄 Tarefas Periódicas</h2><p>Em desenvolvimento.</p>'; }
        function renderEstoque(c) { c.innerHTML = '<h2>📦 Estoque</h2><p>Em desenvolvimento.</p>'; }

        // =====================================================
        // INICIALIZAÇÃO
        // =====================================================
        window.addEventListener('DOMContentLoaded', async () => {
            await loadSession();
            supabase.auth.onAuthStateChange((event, newSession) => {
                if (event === 'SIGNED_OUT') logout();
                else if (newSession) { session = newSession; loadProfile().then(() => {
                    document.getElementById('login-screen').classList.add('hidden');
                    document.getElementById('app-screen').classList.remove('hidden');
                    navigateTo('dashboard');
                });}
            });
            document.getElementById('login-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                try { await login(document.getElementById('username').value, document.getElementById('password').value); }
                catch { document.getElementById('login-error').textContent = 'Credenciais inválidas.'; }
            });
        });
    </script>
</body>
