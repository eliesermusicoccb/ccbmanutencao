<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema Predial Profissional</title>

<style>
body { font-family: Arial; background:#f4f6f8; padding:15px; }
h1 { color:#333; }
.nav button { margin:5px; padding:8px; border:none; border-radius:5px; cursor:pointer; }

.section { display:none; }
.active { display:block; }

.card {
  background:white;
  padding:10px;
  margin-top:10px;
  border-radius:5px;
  border-left:5px solid #2e7d32;
}

input, textarea {
  width:100%;
  margin:5px 0;
  padding:8px;
}

.alert { color:red; font-weight:bold; }
.ok { color:green; }
</style>
</head>

<body>

<h1>🏠 Sistema Predial Profissional</h1>

<div class="nav">
<button onclick="show('manut')">🔧 Manutenção</button>
<button onclick="show('estoque')">📦 Estoque</button>
<button onclick="show('tarefas')">📋 Kanban</button>
<button onclick="show('compras')">🛒 Compras</button>
<button onclick="show('chat')">💬 Chat</button>
</div>

<!-- MANUTENÇÃO -->
<div id="manut" class="section active">
<h2>Manutenção</h2>

<input id="local" placeholder="Local">
<input id="desc" placeholder="Descrição">
<input id="mat" placeholder="Materiais (separar por vírgula)">

<button onclick="addManut()">Adicionar</button>

<div id="listaManut"></div>
</div>

<!-- ESTOQUE -->
<div id="estoque" class="section">
<h2>Estoque</h2>

<input id="eNome" placeholder="Item">
<input id="eQtd" type="number" placeholder="Quantidade">

<button onclick="addEstoque()">Adicionar</button>

<div id="listaEstoque"></div>
</div>

<!-- KANBAN -->
<div id="tarefas" class="section">
<h2>Tarefas Preventivas</h2>

<input id="tDesc" placeholder="Descrição">
<input id="tProd" placeholder="Produto">
<input id="tEst" type="number" placeholder="Estoque atual">
<input id="tMin" type="number" placeholder="Mínimo">
<input id="tCons" type="number" placeholder="Consumo/mês">

<button onclick="addTarefa()">Adicionar</button>

<div id="listaTarefas"></div>
</div>

<!-- COMPRAS -->
<div id="compras" class="section">
<h2>🛒 Lista de Compras</h2>
<div id="listaCompras"></div>
</div>

<!-- CHAT -->
<div id="chat" class="section">
<h2>Chat</h2>

<div id="chatBox" style="height:250px;overflow:auto;background:#fff;padding:5px;border-radius:5px;"></div>

<input id="msg" placeholder="Digite mensagem">
<input type="file" id="file">

<button onclick="enviar()">Enviar</button>
</div>

<script>

// ===== DADOS =====
let manut = JSON.parse(localStorage.getItem("manut")) || [];
let estoque = JSON.parse(localStorage.getItem("estoque")) || [];
let tarefas = JSON.parse(localStorage.getItem("tarefas")) || [];
let chat = JSON.parse(localStorage.getItem("chat")) || [];
let compras = JSON.parse(localStorage.getItem("compras")) || [];

// ===== NAVEGAÇÃO =====
function show(id) {
  document.querySelectorAll(".section").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

// ===== MANUTENÇÃO INTEGRADA =====
function addManut() {

  let materiais = document.getElementById("mat").value.split(",");
  let falta = [];

  materiais.forEach(m => {
    m = m.trim();
    if (!m) return;

    let item = estoque.find(e => e.nome.toLowerCase() === m.toLowerCase());

    if (!item || item.qtd <= 0) {
      falta.push(m);
    } else {
      item.qtd--; // baixa no estoque
    }
  });

  compras = [...compras, ...falta];

  manut.push({
    local: local.value,
    desc: desc.value,
    materiais
  });

  salvarTudo();
}

// ===== ESTOQUE =====
function addEstoque() {
  estoque.push({ nome:eNome.value, qtd:parseInt(eQtd.value) || 0 });
  salvarTudo();
}

// ===== KANBAN =====
function addTarefa() {

  tarefas.push({
    desc:tDesc.value,
    prod:tProd.value,
    est:parseInt(tEst.value) || 0,
    min:parseInt(tMin.value) || 0,
    cons:parseInt(tCons.value) || 0
  });

  salvarTudo();
}

// ===== CHAT =====
function enviar() {
  let texto = msg.value;
  let file = document.getElementById("file").files[0];

  if (file) {
    let reader = new FileReader();

    reader.onload = function(e){
      chat.push({tipo:"file",conteudo:e.target.result});
      salvarTudo();
    }

    reader.readAsDataURL(file);

  } else if(texto){
    chat.push({tipo:"txt",conteudo:texto});
    salvarTudo();
  }
}

function apagar(i){
  if(confirm("Excluir mensagem?")){
    chat.splice(i,1);
    salvarTudo();
  }
}

// ===== ATUALIZAR =====
function atualizar() {

  // MANUT
  listaManut.innerHTML = manut.map(m =>
    `<div class="card">
      <b>${m.local}</b><br>
      ${m.desc}<br>
      Materiais: ${m.materiais.join(", ")}
    </div>`
  ).join("");

  // ESTOQUE
  listaEstoque.innerHTML = estoque.map(e =>
    `<div class="card">${e.nome} (${e.qtd})</div>`
  ).join("");

  // KANBAN
  listaTarefas.innerHTML = tarefas.map(t => {

    let status = "🟢 OK";
    if (t.est <= t.min) status = "🔴 Comprar urgente";

    return `<div class="card">
      <b>${t.desc}</b><br>
      Produto: ${t.prod}<br>
      Estoque: ${t.est} / Min: ${t.min}<br>
      Consumo/mês: ${t.cons}<br>
      <b>${status}</b>
    </div>`;
    
  }).join("");

  // COMPRAS
  listaCompras.innerHTML = compras.map(c =>
    `<div class="card alert">${c}</div>`
  ).join("");

  // CHAT
  chatBox.innerHTML = chat.map((c,i) =>
    `<div class="card">
      ${c.tipo==="txt" ? c.conteudo : `<{c.conteudo}📎 Arquivo</a>`}
      <br>
      <button onclick="apagar(${i})">Excluir</button>
    </div>`
  ).join("");
}

// ===== SALVAR =====
function salvarTudo() {
  localStorage.setItem("manut", JSON.stringify(manut));
  localStorage.setItem("estoque", JSON.stringify(estoque));
  localStorage.setItem("tarefas", JSON.stringify(tarefas));
  localStorage.setItem("chat", JSON.stringify(chat));
  localStorage.setItem("compras", JSON.stringify(compras));

  atualizar();
}

// INIT
atualizar();

</script>

</body>
</html>
