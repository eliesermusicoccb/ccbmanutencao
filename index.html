<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Manutenção CCB</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --primary: #2c3e50;
            --accent: #25D366; /* verde WhatsApp */
            --danger: #e74c3c;
            --success: #2ecc71;
            --bg: #f0f2f5;
            --white: #fff;
            --text: #111;
            --border: #e0e0e0;
            --radius: 12px;
            --shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding-bottom: 70px;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            padding: 16px;
        }
        .bottom-menu {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--white);
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            border-top: 1px solid var(--border);
            z-index: 1000;
        }
        .menu-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: none;
            border: none;
            font-size: 12px;
            color: #666;
            cursor: pointer;
            gap: 4px;
        }
        .menu-item.active {
            color: var(--accent);
            font-weight: bold;
        }
        .menu-item span:first-child {
            font-size: 24px;
        }
        .card {
            background: var(--white);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
        }
        .btn {
            display: inline-block;
            padding: 10px 20px;
            border: none;
            border-radius: 30px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-primary {
            background: var(--accent);
            color: white;
        }
        .btn-danger {
            background: var(--danger);
            color: white;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            margin: 8px 0 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 16px;
        }
        label {
            font-weight: 600;
            display: block;
            margin-top: 12px;
        }
        .hidden {
            display: none !important;
        }
        #login-screen {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: var(--bg);
        }
        .login-box {
            background: white;
            padding: 32px;
            border-radius: var(--radius);
            width: 100%;
            max-width: 380px;
            box-shadow: var(--shadow);
        }
        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 8px 16px;
            border-radius: 30px;
            z-index: 2000;
            font-size: 14px;
        }
        /* Chat */
        .chat-messages {
            height: 60vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 8px;
            background: #e5ddd5;
            border-radius: 12px;
        }
        .message {
            max-width: 80%;
            padding: 8px 12px;
            border-radius: 18px;
            position: relative;
            word-wrap: break-word;
        }
        .message-sent {
            background: #dcf8c5;
            align-self: flex-end;
        }
        .message-received {
            background: white;
            align-self: flex-start;
        }
        .message-info {
            font-size: 10px;
            color: #666;
            display: flex;
            justify-content: space-between;
            margin-top: 4px;
            gap: 12px;
        }
        .message-media {
            max-width: 200px;
            max-height: 200px;
            border-radius: 12px;
            margin-top: 4px;
        }
        .delete-msg {
            font-size: 10px;
            color: red;
            cursor: pointer;
            margin-left: 8px;
        }
        .chat-input-area {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            align-items: center;
            background: white;
            padding: 8px;
            border-radius: 30px;
        }
        .chat-input-area input {
            flex: 1;
            margin: 0;
            border: none;
            outline: none;
        }
        .file-buttons {
            display: flex;
            gap: 8px;
        }
        .file-buttons button {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
        }
        @media (max-width: 600px) {
            .message { max-width: 90%; }
        }
    </style>
</head>
<body>

<div id="login-screen">
    <div class="login-box">
        <h1>🔧 Manutenção CCB</h1>
        <form id="login-form">
            <label>Usuário</label>
            <input type="text" id="username" placeholder="ex: elieser" required>
            <div style="font-size:12px; color:#888;">@ccbtorrinha.com.br será adicionado</div>
            <label>Senha</label>
            <input type="password" id="password" required>
            <button type="submit" class="btn btn-primary" style="width:100%; margin-top:16px;">Entrar</button>
        </form>
        <p id="login-error" style="color:red; margin-top:12px;"></p>
    </div>
</div>

<div id="app-screen" class="hidden">
    <div class="container" id="app-content"></div>
    <nav class="bottom-menu" id="bottom-menu">
        <button class="menu-item" data-page="dashboard">🏠 Início</button>
        <button class="menu-item" data-page="issues">📋 Pendências</button>
        <button class="menu-item" data-page="tasks">📅 Cronograma</button>
        <button class="menu-item" data-page="stock">📦 Estoque</button>
        <button class="menu-item" data-page="chat">💬 Chat</button>
        <button class="menu-item admin-only hidden" data-page="admin">⚙️ Admin</button>
    </nav>
</div>

<script>
    // ==================== CONFIG SUPABASE ====================
    const SUPABASE_URL = 'https://ybsqrvtmhfhxjegenzgw.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlic3FydnRtaGZoeGplZ2Vuemd3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3Mjk3NzAsImV4cCI6MjA5NTMwNTc3MH0.ODE4fv9OReGht0xAbl82kTg0hkMb6dQO9ZhHqWcI7u8';
    const DOMAIN = '@ccbtorrinha.com.br';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;      // perfil do usuário logado
    let currentPage = 'dashboard';
    let chatSubscription = null;

    // ==================== UTILITÁRIOS ====================
    function showToast(msg, type = 'info') {
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.innerText = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    function formatDateTime(date) {
        return new Date(date).toLocaleString('pt-BR', { hour: '2-digit', minute:'2-digit', day:'2-digit', month:'short' });
    }

    // ==================== AUTENTICAÇÃO ====================
    async function login(username, password) {
        const email = username.trim().toLowerCase() + DOMAIN;
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) throw error;
        return data;
    }

    async function logout() {
        await supabase.auth.signOut();
        currentUser = null;
        document.getElementById('login-screen').classList.remove('hidden');
        document.getElementById('app-screen').classList.add('hidden');
        if (chatSubscription) chatSubscription.unsubscribe();
    }

    async function loadUserProfile(userId) {
        const { data, error } = await supabase
            .from('profiles')
            .select('*, cities(id, name), houses(id, name)')
            .eq('id', userId)
            .single();
        if (error) throw error;
        return data;
    }

    // ==================== PERMISSÕES ====================
    function getVisibilityFilter() {
        if (!currentUser) return {};
        if (currentUser.permission_level === 'house') return { house_id: currentUser.house_id, city_id: currentUser.city_id };
        if (currentUser.permission_level === 'city') return { city_id: currentUser.city_id };
        return {}; // all
    }

    function isAdmin() {
        return currentUser?.role === 'Administrador';
    }

    // ==================== RENDERIZAÇÃO DINÂMICA ====================
    async function navigateTo(page) {
        currentPage = page;
        document.querySelectorAll('.menu-item').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.page === page);
        });
        const container = document.getElementById('app-content');
        container.innerHTML = '<div style="text-align:center;">Carregando...</div>';
        switch(page) {
            case 'dashboard': await renderDashboard(container); break;
            case 'issues': await renderIssues(container); break;
            case 'tasks': await renderTasks(container); break;
            case 'stock': await renderStock(container); break;
            case 'chat': await renderChat(container); break;
            case 'admin': if(isAdmin()) await renderAdmin(container); else navigateTo('dashboard'); break;
            default: await renderDashboard(container);
        }
    }

    async function renderDashboard(container) {
        const filter = getVisibilityFilter();
        const { count: pendingIssues } = await supabase.from('issues').select('*', { count: 'exact', head: true }).match(filter).neq('status', 'concluida');
        const { count: activeTasks } = await supabase.from('tasks').select('*', { count: 'exact', head: true }).match(filter).neq('status', 'concluida');
        container.innerHTML = `
            <div class="card">
                <h2>Olá, ${currentUser.full_name || currentUser.username}</h2>
                <p>🏠 Casa: ${currentUser.houses?.name || 'N/A'}</p>
                <p>📋 Pendências ativas: ${pendingIssues || 0}</p>
                <p>🔄 Tarefas em andamento: ${activeTasks || 0}</p>
                <button class="btn btn-outline" onclick="navigateTo('issues')">Ver Pendências</button>
                <button class="btn btn-primary" onclick="navigateTo('tasks')">Cronograma</button>
                <button class="btn btn-danger" onclick="logout()" style="margin-top:16px;">Sair</button>
            </div>
        `;
    }

    async function renderIssues(container) {
        const filter = getVisibilityFilter();
        const { data: issues } = await supabase.from('issues').select('*').match(filter).order('created_at', { ascending: false });
        container.innerHTML = `
            <h2>📋 Pendências</h2>
            <button class="btn btn-primary" onclick="showNewIssueForm()">+ Nova Pendência</button>
            <div id="issues-list"></div>
        `;
        const listDiv = document.getElementById('issues-list');
        if (!issues.length) { listDiv.innerHTML = '<p>Nenhuma pendência.</p>'; return; }
        listDiv.innerHTML = issues.map(issue => `
            <div class="card">
                <strong>${issue.title}</strong><br>
                <small>Prioridade: ${issue.priority} | Status: ${issue.status}</small>
                <p>${issue.description || ''}</p>
                ${isAdmin() ? `<button class="btn btn-small" onclick="convertToTask(${issue.id})">Criar Tarefa</button>` : ''}
            </div>
        `).join('');
    }

    window.showNewIssueForm = () => {
        const filter = getVisibilityFilter();
        const html = `
            <div class="card">
                <h3>Nova Pendência</h3>
                <input id="issue-title" placeholder="Título">
                <textarea id="issue-desc" placeholder="Descrição"></textarea>
                <select id="issue-priority">
                    <option>baixa</option><option>média</option><option>alta</option><option>urgente</option>
                </select>
                <button class="btn btn-primary" onclick="createIssue()">Salvar</button>
                <button class="btn" onclick="document.querySelector('#new-issue-form').remove()">Cancelar</button>
            </div>
        `;
        const div = document.createElement('div');
        div.id = 'new-issue-form';
        div.innerHTML = html;
        document.getElementById('issues-list').prepend(div);
    };

    window.createIssue = async () => {
        const title = document.getElementById('issue-title').value;
        const desc = document.getElementById('issue-desc').value;
        const priority = document.getElementById('issue-priority').value;
        if (!title) return showToast('Título obrigatório');
        const filter = getVisibilityFilter();
        const { error } = await supabase.from('issues').insert({
            title, description: desc, priority,
            city_id: filter.city_id || currentUser.city_id,
            house_id: filter.house_id || currentUser.house_id,
            created_by: currentUser.id,
            status: 'pendente'
        });
        if (error) showToast('Erro: '+error.message, 'error');
        else { showToast('Pendência criada'); navigateTo('issues'); }
    };

    window.convertToTask = async (issueId) => {
        // Buscar issue
        const { data: issue } = await supabase.from('issues').select('*').eq('id', issueId).single();
        if(!issue) return;
        // Formulário para criar tarefa
        const html = `
            <div class="card" id="task-form-card">
                <h3>Criar Tarefa para: ${issue.title}</h3>
                <label>Data início</label><input type="date" id="start-date">
                <label>Data fim</label><input type="date" id="end-date">
                <label>Responsável</label><select id="responsible"></select>
                <label>Checklist de Materiais (um por linha, ex: "Cimento, 5 sacos")</label>
                <textarea id="materials-list" placeholder="Cimento, 5kg\nAreia, 3m³"></textarea>
                <button class="btn btn-primary" onclick="saveTask(${issue.id})">Criar Tarefa</button>
                <button class="btn" onclick="document.getElementById('task-form-card').remove()">Cancelar</button>
            </div>
        `;
        document.getElementById('issues-list').prepend(html);
        // Carregar usuários da mesma cidade/casa para responsável
        const filter = getVisibilityFilter();
        const { data: users } = await supabase.from('profiles').select('id, full_name').match(filter);
        const select = document.getElementById('responsible');
        users.forEach(u => select.innerHTML += `<option value="${u.id}">${u.full_name}</option>`);
    };

    window.saveTask = async (issueId) => {
        const start = document.getElementById('start-date').value;
        const end = document.getElementById('end-date').value;
        const responsible = document.getElementById('responsible').value;
        const materialsText = document.getElementById('materials-list').value;
        const filter = getVisibilityFilter();
        const { data: task, error } = await supabase.from('tasks').insert({
            issue_id: issueId,
            title: `Tarefa da pendência #${issueId}`,
            start_date: start, end_date: end,
            responsible_id: responsible || null,
            status: 'planejada',
            city_id: filter.city_id || currentUser.city_id,
            house_id: filter.house_id || currentUser.house_id
        }).select().single();
        if (error) return showToast('Erro: '+error.message);
        // Adicionar materiais
        const lines = materialsText.split('\n');
        for (let line of lines) {
            if (line.trim()) {
                let [name, qty] = line.split(',');
                await supabase.from('task_materials').insert({
                    task_id: task.id,
                    material_name: name.trim(),
                    quantity_needed: parseFloat(qty) || 0,
                    unit: 'un'
                });
            }
        }
        showToast('Tarefa criada com checklist!');
        navigateTo('tasks');
    };

    async function renderTasks(container) {
        const filter = getVisibilityFilter();
        const { data: tasks } = await supabase.from('tasks').select('*, responsible:responsible_id(full_name)').match(filter).order('start_date', { nullsFirst: false });
        container.innerHTML = `<h2>📅 Cronograma de Tarefas</h2><div id="tasks-list"></div>`;
        const listDiv = document.getElementById('tasks-list');
        if (!tasks.length) { listDiv.innerHTML = '<p>Nenhuma tarefa planejada.</p>'; return; }
        listDiv.innerHTML = tasks.map(task => `
            <div class="card">
                <strong>${task.title}</strong>
                <p>📅 ${task.start_date || '?'} → ${task.end_date || '?'}</p>
                <p>👤 Responsável: ${task.responsible?.full_name || 'Não definido'}</p>
                <p>✅ Progresso: ${task.progress}%</p>
                <button class="btn btn-small" onclick="showTaskMaterials(${task.id})">Ver Checklist</button>
                ${isAdmin() ? `<button class="btn btn-small btn-primary" onclick="updateTaskProgress(${task.id})">Atualizar Progresso</button>` : ''}
            </div>
        `).join('');
    }

    window.showTaskMaterials = async (taskId) => {
        const { data: mats } = await supabase.from('task_materials').select('*').eq('task_id', taskId);
        let html = '<div class="card"><h4>Materiais Necessários</h4><ul>';
        mats.forEach(m => html += `<li>${m.material_name}: ${m.quantity_needed} ${m.unit} (usado: ${m.quantity_used})</li>`);
        html += '</ul><button class="btn" onclick="this.parentElement.remove()">Fechar</button></div>';
        document.getElementById('tasks-list').prepend(html);
    };

    window.updateTaskProgress = async (taskId) => {
        const newProgress = prompt('Novo progresso (0-100):', '50');
        if (newProgress !== null) {
            await supabase.from('tasks').update({ progress: parseInt(newProgress), status: parseInt(newProgress) === 100 ? 'concluida' : 'em_andamento' }).eq('id', taskId);
            navigateTo('tasks');
        }
    };

    async function renderStock(container) {
        const filter = getVisibilityFilter();
        const { data: stock } = await supabase.from('stock_items').select('*').match(filter);
        container.innerHTML = `<h2>📦 Estoque</h2><div id="stock-list"></div>`;
        const listDiv = document.getElementById('stock-list');
        if (!stock.length) { listDiv.innerHTML = '<p>Nenhum item cadastrado.</p>'; return; }
        listDiv.innerHTML = stock.map(item => `
            <div class="card">
                <strong>${item.name}</strong> - ${item.quantity} ${item.unit || ''}
                <br><small>Mínimo: ${item.min_stock}</small>
                ${isAdmin() ? `<button class="btn btn-small" onclick="updateStock(${item.id})">Atualizar</button>` : ''}
            </div>
        `).join('');
    }

    window.updateStock = async (id) => {
        const qty = prompt('Nova quantidade:');
        if (qty) await supabase.from('stock_items').update({ quantity: parseFloat(qty), last_updated: new Date() }).eq('id', id);
        navigateTo('stock');
    };

    // ==================== CHAT COMPLETO ====================
    async function renderChat(container) {
        container.innerHTML = `
            <div style="display:flex; justify-content:space-between;">
                <h2>💬 Chat</h2>
                <select id="chat-filter" style="width:auto;">
                    <option value="all">Todas mensagens</option>
                </select>
            </div>
            <div id="chat-messages" class="chat-messages"></div>
            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="Digite sua mensagem...">
                <div class="file-buttons">
                    <button id="attach-image">📷</button>
                    <button id="attach-video">🎥</button>
                    <button id="attach-audio">🎤</button>
                    <button id="attach-pdf">📄</button>
                </div>
                <button id="send-msg" class="btn btn-primary">➤</button>
            </div>
            <input type="file" id="file-input" accept="image/*,video/*,audio/*,application/pdf" style="display:none">
        `;
        await loadChatMessages();
        setupChatRealtime();
        setupChatEventListeners();
    }

    async function loadChatMessages() {
        const filter = getVisibilityFilter();
        let query = supabase.from('chat_messages').select('*, sender:sender_id(full_name, username)').eq('is_deleted', false);
        if (filter.house_id) query = query.eq('house_id', filter.house_id);
        else if (filter.city_id) query = query.eq('city_id', filter.city_id);
        const { data } = await query.order('created_at', { ascending: true });
        const container = document.getElementById('chat-messages');
        if (!container) return;
        container.innerHTML = '';
        data.forEach(msg => {
            const isOwn = msg.sender_id === currentUser.id;
            const div = document.createElement('div');
            div.className = `message ${isOwn ? 'message-sent' : 'message-received'}`;
            let mediaHtml = '';
            if (msg.media_url && msg.media_type) {
                if (msg.media_type === 'image') mediaHtml = `<img src="${msg.media_url}" class="message-media">`;
                else if (msg.media_type === 'video') mediaHtml = `<video src="${msg.media_url}" controls class="message-media"></video>`;
                else if (msg.media_type === 'audio') mediaHtml = `<audio src="${msg.media_url}" controls></audio>`;
                else if (msg.media_type === 'pdf') mediaHtml = `<a href="${msg.media_url}" target="_blank">📄 Ver PDF</a>`;
            }
            div.innerHTML = `
                <div><strong>${msg.sender?.full_name || msg.sender?.username}</strong> ${mediaHtml}<br>${msg.message || ''}</div>
                <div class="message-info">
                    <span>${formatDateTime(msg.created_at)}</span>
                    ${isOwn ? `<span class="delete-msg" data-id="${msg.id}">🗑️ Apagar</span>` : ''}
                </div>
            `;
            container.appendChild(div);
        });
        container.scrollTop = container.scrollHeight;
        // adicionar eventos de deletar
        document.querySelectorAll('.delete-msg').forEach(el => {
            el.addEventListener('click', async (e) => {
                const id = el.dataset.id;
                await supabase.from('chat_messages').update({ is_deleted: true }).eq('id', id);
                loadChatMessages();
            });
        });
    }

    function setupChatRealtime() {
        if (chatSubscription) chatSubscription.unsubscribe();
        const filter = getVisibilityFilter();
        let channelFilter = {};
        if (filter.house_id) channelFilter = { house_id: filter.house_id };
        else if (filter.city_id) channelFilter = { city_id: filter.city_id };
        chatSubscription = supabase
            .channel('chat-room')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chat_messages', filter: channelFilter }, () => loadChatMessages())
            .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'chat_messages', filter: channelFilter }, () => loadChatMessages())
            .subscribe();
    }

    function setupChatEventListeners() {
        const sendBtn = document.getElementById('send-msg');
        const input = document.getElementById('chat-input');
        const fileInput = document.getElementById('file-input');
        let currentMediaType = null;

        const sendMessage = async (text, mediaUrl = null, mediaType = null) => {
            const filter = getVisibilityFilter();
            const { error } = await supabase.from('chat_messages').insert({
                sender_id: currentUser.id,
                city_id: filter.city_id || null,
                house_id: filter.house_id || null,
                message: text || null,
                media_url: mediaUrl,
                media_type: mediaType
            });
            if (error) showToast('Erro ao enviar: '+error.message);
            else input.value = '';
        };

        sendBtn.onclick = () => { if (input.value.trim()) sendMessage(input.value.trim()); };
        input.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(input.value.trim()); });

        const attachFile = (accept, mediaType) => {
            fileInput.accept = accept;
            currentMediaType = mediaType;
            fileInput.click();
        };
        document.getElementById('attach-image').onclick = () => attachFile('image/*', 'image');
        document.getElementById('attach-video').onclick = () => attachFile('video/*', 'video');
        document.getElementById('attach-audio').onclick = () => attachFile('audio/*', 'audio');
        document.getElementById('attach-pdf').onclick = () => attachFile('application/pdf', 'pdf');

        fileInput.onchange = async () => {
            const file = fileInput.files[0];
            if (!file) return;
            const ext = file.name.split('.').pop();
            const filePath = `chat/${currentUser.id}_${Date.now()}.${ext}`;
            const { error: uploadError } = await supabase.storage.from('chat_media').upload(filePath, file);
            if (uploadError) return showToast('Erro upload: '+uploadError.message);
            const { data: { publicUrl } } = supabase.storage.from('chat_media').getPublicUrl(filePath);
            sendMessage(null, publicUrl, currentMediaType);
            fileInput.value = '';
        };
    }

    // ==================== ADMIN ====================
    async function renderAdmin(container) {
        const { data: cities } = await supabase.from('cities').select('*');
        const { data: houses } = await supabase.from('houses').select('*, cities(name)');
        const { data: users } = await supabase.from('profiles').select('*');
        container.innerHTML = `
            <h2>⚙️ Administração</h2>
            <div class="card">
                <h3>Novo Usuário</h3>
                <input id="new-username" placeholder="username">
                <input id="new-fullname" placeholder="Nome completo">
                <input id="new-password" type="password" placeholder="Senha">
                <select id="new-role"><option>Usuário</option><option>Gestor da Manutenção</option><option>Administrador</option></select>
                <select id="new-permission"><option value="house">Apenas sua casa</option><option value="city">Apenas sua cidade</option><option value="all">Todas cidades</option></select>
                <select id="new-city"><option value="">Selecione cidade</option>${cities.map(c => `<option value="${c.id}">${c.name}</option>`)}</select>
                <select id="new-house"><option value="">Selecione casa</option>${houses.map(h => `<option value="${h.id}">${h.name} (${h.cities?.name})</option>`)}</select>
                <button class="btn btn-primary" onclick="createUser()">Criar Usuário</button>
            </div>
            <h3>Usuários Existentes</h3>
            <div id="user-list">${users.map(u => `<div>${u.full_name} (${u.role}) - ${u.permission_level} <button onclick="deleteUser('${u.id}')">🗑️</button></div>`).join('')}</div>
        `;
    }

    window.createUser = async () => {
        const username = document.getElementById('new-username').value;
        const fullname = document.getElementById('new-fullname').value;
        const password = document.getElementById('new-password').value;
        const role = document.getElementById('new-role').value;
        const perm = document.getElementById('new-permission').value;
        const cityId = document.getElementById('new-city').value ? parseInt(document.getElementById('new-city').value) : null;
        const houseId = document.getElementById('new-house').value ? parseInt(document.getElementById('new-house').value) : null;
        if (!username || !password) return showToast('Usuário e senha obrigatórios');
        const email = username + DOMAIN;
        const { data: user, error } = await supabase.auth.signUp({ email, password });
        if (error) return showToast('Erro: '+error.message);
        await supabase.from('profiles').insert({
            id: user.user.id, username, full_name: fullname, role, permission_level: perm,
            city_id: cityId, house_id: houseId
        });
        showToast('Usuário criado');
        navigateTo('admin');
    };

    window.deleteUser = async (id) => {
        if(confirm('Deletar usuário?')) {
            await supabase.auth.admin.deleteUser(id);
            await supabase.from('profiles').delete().eq('id', id);
            navigateTo('admin');
        }
    };

    // ==================== INICIALIZAÇÃO ====================
    async function init() {
        const { data: { session } } = await supabase.auth.getSession();
        if (session) {
            currentUser = await loadUserProfile(session.user.id);
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');
            document.querySelectorAll('.admin-only').forEach(el => el.classList.toggle('hidden', !isAdmin()));
            navigateTo('dashboard');
        }
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                await login(document.getElementById('username').value, document.getElementById('password').value);
                init(); // recarrega
            } catch (err) {
                document.getElementById('login-error').innerText = 'Credenciais inválidas';
            }
        });
        supabase.auth.onAuthStateChange(async (event, session) => {
            if (event === 'SIGNED_OUT') logout();
            else if (session) init();
        });
    }
    init();
</script>
</body>
</html>
