<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Manutenção Rápida</title>
    <!-- Link para estilização simples e limpa -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
    <!-- Conexão com o Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <main class="container">
        <h1>Gestão de Manutenção</h1>
        
        <!-- SEÇÃO 1: FORMULÁRIO DE ABERTURA RÁPIDA -->
        <section id="formulario-registro">
            <h3>Nova Pendência</h3>
            <form id="form-manutencao">
                <label for="local">Local / Ativo:</label>
                <input type="text" id="local" placeholder="Ex: Linha 1, Compressor, Ar Condicionado" required>

                <label for="descricao">Descrição do Problema:</label>
                <textarea id="descricao" placeholder="Relate o que está acontecendo..." required></textarea>

                <label for="foto">Foto da Evidência:</label>
                <input type="file" id="foto" accept="image/*">

                <button type="submit">Adicionar Pendência</button>
            </form>
        </section>

        <hr>

        <!-- SEÇÃO 2: LISTA DE PENDÊNCIAS -->
        <section id="lista-pendencias">
            <h3>Itens Pendentes</h3>
            <div id="lista-cards">
                <!-- Os itens do banco vão aparecer aqui dentro automaticamente -->
                <p>Carregando pendências...</p>
            </div>
        </section>
    </main>

    <script>
        // CONFIGURAÇÃO DO SUPABASE
        // Substitua com as credenciais do seu painel do Supabase (Project Settings > API)
        const SUPABASE_URL = "SUA_URL_DO_SUPABASE";
        const SUPABASE_KEY = "SUA_CHAVE_ANON_KEY_DO_SUPABASE";
        const supabase = @supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const form = document.getElementById('form-manutencao');
        const listaCards = document.getElementById('lista-cards');

        // Função para buscar e exibir a lista de pendências
        async function buscarPendencias() {
            let { data: manutencoes, error } = await supabase
                .from('manutencoes')
                .select('*')
                .eq('status', 'Pendente') // Mostra apenas os pendentes na lista principal
                .order('data_abertura', { ascending: false });

            if (error) {
                listaCards.innerHTML = "<p>Erro ao carregar dados.</p>";
                return;
            }

            if (manutencoes.length === 0) {
                listaCards.innerHTML = "<p>Nenhuma pendência registrada! Tudo rodando bem. 🙌</p>";
                return;
            }

            listaCards.innerHTML = "";
            manutencoes.forEach(item => {
                const dataFormatada = new Date(item.data_abertura).toLocaleString('pt-BR');
                let fotoHtml = item.foto_url ? `<p><a href="${item.foto_url}" target="_blank">🖼️ Ver Foto Anexa</a></p>` : '';
                
                listaCards.innerHTML += `
                    <article style="border-left: 5px solid #e53e3e;">
                        <header>
                            <strong>📍 ${item.local}</strong> 
                            <small style="float: right;">${dataFormatada}</small>
                        </header>
                        <p>${item.descricao}</p>
                        ${fotoHtml}
                        <footer>
                            <button class="secondary" onclick="abrirOportunidade('${item.id}')">⚙️ Planejar Manutenção</button>
                        </footer>
                    </article>
                `;
            });
        }

        // Função para salvar uma nova pendência (Abertura Rápida)
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const local = document.getElementById('local').value;
            const descricao = document.getElementById('descricao').value;
            const fotoFile = document.getElementById('foto').files[0];
            let fotoUrl = null;

            // Se houver foto, faz o upload para o Storage primeiro
            if (fotoFile) {
                const nomeArquivo = `${Date.now()}_${fotoFile.name}`;
                let { data, error } = await supabase.storage
                    .from('fotos-manutencao')
                    .upload(nomeArquivo, fotoFile);
                
                if (!error) {
                    const { data: publicUrlData } = supabase.storage
                        .from('fotos-manutencao')
                        .getPublicUrl(nomeArquivo);
                    fotoUrl = publicUrlData.publicUrl;
                }
            }

            // Insere os dados básicos na tabela (A data_abertura é automática do banco)
            const { error } = await supabase
                .from('manutencoes')
                .insert([{ local, descricao, foto_url: fotoUrl }]);

            if (!error) {
                form.reset();
                buscarPendencias(); // Atualiza a lista na tela
                alert("Pendência registrada com sucesso!");
            } else {
                alert("Erro ao salvar: " + error.message);
            }
        });

        // Função que será usada no futuro para abrir os detalhes da oportunidade
        function abrirOportunidade(id) {
            alert("Aqui vamos abrir a tela detalhada para o ID: " + id + " para adicionar responsável, datas e checklist.");
        }

        // Inicializa a lista ao abrir o app
        buscarPendencias();
    </script>
</body>
</html>
