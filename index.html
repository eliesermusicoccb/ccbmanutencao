<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a1a2e">
<title>TORRINHA SP — Gestão do Templo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --blue:#1e3a6e;
  --blue2:#2d5299;
  --blue3:#4a7ad4;
  --blue-light:#e8f0fc;
  --gold:#b8923a;
  --gold2:#d4ab55;
  --gold-light:#fdf3e0;
  --bg:#f0eff5;
  --surface:#ffffff;
  --surface2:#f7f6fb;
  --border:#e0ddf0;
  --border2:#ccc9e0;
  --text:#1a1828;
  --text2:#4a4760;
  --text3:#8a879e;
  --ok:#2d7d4f;
  --ok-bg:#e6f5ec;
  --warn:#b36000;
  --warn-bg:#fff3e0;
  --danger:#c0263a;
  --danger-bg:#fde8eb;
  --info:#1e6fa8;
  --info-bg:#e6f2fb;
  --shadow:0 2px 12px rgba(30,26,80,0.08),0 1px 3px rgba(30,26,80,0.05);
  --shadow-lg:0 8px 32px rgba(30,26,80,0.14);
  --r:14px;
  --r-sm:9px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Sora',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;}

.header{background:linear-gradient(135deg,#0f1f4a 0%,#1e3a6e 55%,#1a3360 100%);padding:0 16px 0;position:sticky;top:0;z-index:200;box-shadow:0 4px 20px rgba(10,20,60,0.35);}
.header-inner{display:flex;align-items:center;justify-content:space-between;min-height:64px;max-width:680px;margin:0 auto;gap:10px;}
.header-logo{display:flex;align-items:center;gap:10px;}
.logo-box{width:42px;height:42px;border-radius:11px;background:rgba(255,255,255,0.1);border:1.5px solid rgba(184,146,58,0.5);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:'Lora',serif;font-size:13px;font-weight:600;color:var(--gold2);line-height:1;text-align:center;letter-spacing:0.5px;}
.header-text strong{font-family:'Lora',serif;font-size:17px;font-weight:600;color:#fff;letter-spacing:0.2px;line-height:1.1;}
.header-text small{display:block;font-size:10.5px;color:rgba(255,255,255,0.6);margin-top:2px;letter-spacing:0.3px;}
.header-actions{display:flex;align-items:center;gap:6px;}
.hbtn{width:40px;height:40px;border-radius:11px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.18);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;position:relative;transition:background 0.15s;}
.hbtn:active{background:rgba(255,255,255,0.2);}
.hbtn .badge-num{position:absolute;top:4px;right:4px;min-width:16px;height:16px;border-radius:8px;background:#f04;border:1.5px solid #1e3a6e;color:#fff;font-size:9px;font-weight:700;display:none;align-items:center;justify-content:center;padding:0 3px;}
.hbtn.has-num .badge-num{display:flex;}

.tabs-wrap{background:#fff;border-bottom:1px solid var(--border);position:sticky;top:64px;z-index:190;box-shadow:0 2px 8px rgba(30,26,80,0.06);}
.tabs-inner{display:flex;max-width:680px;margin:0 auto;overflow-x:auto;scrollbar-width:none;}
.tabs-inner::-webkit-scrollbar{display:none;}
.tab-btn{flex:1;min-width:75px;padding:11px 6px 9px;font-size:11px;font-weight:600;color:var(--text3);background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;transition:color 0.18s;font-family:'Sora',sans-serif;white-space:nowrap;letter-spacing:0.2px;}
.tab-btn .ti{font-size:19px;}
.tab-btn.active{color:var(--blue2);}
.tab-btn.active::after{content:'';position:absolute;bottom:0;left:14px;right:14px;height:2.5px;background:var(--blue2);border-radius:2px 2px 0 0;}
.tab-badge{position:absolute;top:7px;right:calc(50% - 18px);background:var(--danger);color:#fff;font-size:9px;font-weight:700;min-width:15px;height:15px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px;}

.main{max-width:680px;margin:0 auto;padding:14px 14px 100px;}
.panel{display:none;}.panel.active{display:block;}

.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;}
.sum-card{background:var(--surface);border-radius:var(--r);padding:14px 10px;text-align:center;box-shadow:var(--shadow);cursor:pointer;border:1px solid var(--border);transition:transform 0.15s;}
.sum-card:active{transform:scale(0.97);}
.sum-num{font-family:'Lora',serif;font-size:30px;font-weight:600;line-height:1;margin-bottom:4px;}
.sum-label{font-size:10.5px;color:var(--text2);font-weight:600;letter-spacing:0.3px;}

.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;margin-top:6px;}
.sec-title{font-size:11.5px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:0.8px;}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border-radius:var(--r-sm);font-size:13.5px;font-weight:600;cursor:pointer;border:none;transition:opacity 0.15s,transform 0.12s;font-family:'Sora',sans-serif;}
.btn:active{transform:scale(0.98);opacity:0.88;}
.btn-primary{background:var(--blue2);color:#fff;}.btn-secondary{background:var(--surface);color:var(--text);border:1.5px solid var(--border2);}.btn-danger{background:var(--danger);color:#fff;}.btn-ok{background:var(--ok);color:#fff;}.btn-sm{padding:6px 12px;font-size:12px;}

.form-group{margin-bottom:14px;}
.form-label{display:block;font-size:12px;font-weight:700;color:var(--text2);margin-bottom:6px;letter-spacing:0.3px;}
.form-input{width:100%;padding:10px 12px;border-radius:var(--r-sm);border:1.5px solid var(--border2);background:var(--surface);color:var(--text);font-size:14px;font-family:'Sora',sans-serif;transition:border-color 0.2s;}
.form-input:focus{outline:none;border-color:var(--blue3);box-shadow:0 0 0 3px rgba(74,122,212,0.12);}
textarea.form-input{resize:vertical;min-height:80px;line-height:1.5;}

.modal-overlay{position:fixed;inset:0;z-index:500;background:rgba(10,20,50,0.55);backdrop-filter:blur(3px);display:none;align-items:flex-end;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal-sheet{background:var(--surface);border-radius:24px 24px 0 0;width:100%;max-width:680px;max-height:90vh;overflow:hidden;display:flex;flex-direction:column;animation:slideUp 0.28s cubic-bezier(0.32,0.72,0,1);}
@keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
.modal-body{overflow-y:auto;padding:16px 18px 24px;flex:1;}

.empty{text-align:center;padding:40px 20px;color:var(--text3);}

#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:#1a1828;color:#fff;padding:10px 18px;border-radius:99px;font-size:13px;font-weight:600;opacity:0;transition:all 0.25s;z-index:9999;white-space:nowrap;pointer-events:none;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,0.25);}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ─── LOGIN ─── */
.login-screen{position:fixed;inset:0;background:linear-gradient(135deg,#0f1f4a 0%,#1e3a6e 100%);display:flex;align-items:center;justify-content:center;z-index:1000;animation:fadeIn 0.3s;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.login-box{background:#fff;border-radius:20px;padding:40px 30px;box-shadow:0 10px 40px rgba(0,0,0,0.25);width:90%;max-width:320px;text-align:center;}
.login-logo{width:60px;height:60px;margin:0 auto 20px;border-radius:15px;background:linear-gradient(135deg,#0f1f4a,#1e3a6e);display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Lora',serif;font-size:20px;font-weight:700;}
.login-title{font-family:'Lora',serif;font-size:22px;font-weight:700;margin-bottom:4px;}
.login-location{font-size:12px;color:var(--text3);margin-bottom:20px;letter-spacing:0.5px;text-transform:uppercase;font-weight:600;}
.login-sub{font-size:13px;color:var(--text2);margin-bottom:20px;}
.login-form{display:none;}
.login-form.active{display:block;}
.login-form input{width:100%;padding:11px 14px;border:1.5px solid var(--border2);border-radius:var(--r-sm);margin-bottom:12px;font-size:14px;font-family:'Sora',sans-serif;}
.login-form input:focus{outline:none;border-color:var(--blue3);}
.pass-toggle{position:relative;margin-bottom:12px;}
.pass-toggle input{padding-right:38px;width:100%;}
.pass-toggle button{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text3);font-size:16px;}
.login-form button{width:100%;padding:11px;background:var(--blue2);color:#fff;border:none;border-radius:var(--r-sm);font-size:14px;font-weight:700;cursor:pointer;margin-bottom:8px;transition:opacity 0.15s;}
.login-form button:active{opacity:0.88;}
.login-form a{display:block;font-size:12px;color:var(--blue2);text-decoration:none;cursor:pointer;margin-top:12px;font-weight:600;}

/* ─── CHAT ─── */
.chat-wrap{display:flex;flex-direction:column;height:calc(100vh - 180px);min-height:300px;}
.chat-messages{flex:1;overflow-y:auto;padding:10px 0;display:flex;flex-direction:column;gap:6px;}
.chat-day-sep{text-align:center;font-size:10.5px;font-weight:700;color:var(--text3);letter-spacing:0.4px;margin:10px 0;}
.chat-day-sep span{background:var(--bg);padding:2px 10px;border-radius:99px;border:1px solid var(--border);}
.chat-msg{display:flex;align-items:flex-end;gap:7px;padding:0 4px;max-width:100%;animation:msgIn 0.2s ease;}
@keyframes msgIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;}}
.chat-msg.mine{flex-direction:row-reverse;}
.chat-avatar{width:28px;height:28px;border-radius:50%;flex-shrink:0;background:var(--blue-light);color:var(--blue2);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;}
.chat-bubble{max-width:72%;padding:9px 12px;border-radius:18px;background:var(--surface);box-shadow:var(--shadow);border:1px solid var(--border);word-break:break-word;}
.chat-msg.mine .chat-bubble{background:var(--blue2);color:#fff;border:none;}
.chat-sender{font-size:10.5px;font-weight:700;color:var(--blue2);margin-bottom:3px;}
.chat-msg.mine .chat-sender{color:rgba(255,255,255,0.7);}
.chat-text{font-size:13.5px;line-height:1.5;}
.chat-time{font-size:10px;color:var(--text3);margin-top:4px;text-align:right;}
.chat-msg.mine .chat-time{color:rgba(255,255,255,0.6);}
.audio-msg{display:flex;align-items:center;gap:8px;}
.audio-play{width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,0.1);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:inherit;flex-shrink:0;}
.audio-play:active{transform:scale(0.92);}
.audio-info{display:flex;flex-direction:column;gap:2px;}
.audio-duration{font-size:10px;opacity:0.7;}

.chat-input-bar{background:var(--surface);border-top:1px solid var(--border);padding:10px 14px;display:flex;gap:8px;align-items:flex-end;}
.chat-input{flex:1;border:1.5px solid var(--border2);border-radius:22px;padding:9px 14px;font-size:13.5px;font-family:'Sora',sans-serif;background:var(--bg);color:var(--text);resize:none;max-height:80px;min-height:40px;line-height:1.4;}
.chat-input:focus{outline:none;border-color:var(--blue3);}
.chat-send{width:40px;height:40px;border-radius:50%;background:var(--blue2);border:none;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform 0.15s;}
.chat-send:active{transform:scale(0.92);}
.chat-audio-btn{width:40px;height:40px;border-radius:50%;background:var(--ok);border:none;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.15s;}
.chat-audio-btn:active{transform:scale(0.92);}
.chat-audio-btn.recording{background:var(--danger);animation:pulse 0.6s infinite;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(192,38,58,0.7);}50%{box-shadow:0 0 0 8px rgba(192,38,58,0);}}

::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}

@media(max-width:640px){
  .login-box{width:95%;padding:30px 20px;}
}
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div class="login-screen" id="login-screen">
  <div class="login-box">
    <div class="login-logo">🏛</div>
    <div class="login-title">TORRINHA SP</div>
    <div class="login-location">Gestão do Templo</div>
    
    <!-- LOGIN FORM -->
    <form class="login-form active" id="login-form" onsubmit="handleLogin(event)">
      <div class="login-sub">Acesse sua conta</div>
      <input type="text" id="login-user" placeholder="Seu nome de usuário" required>
      <div class="pass-toggle">
        <input type="password" id="login-pass" placeholder="Sua senha" required>
        <button type="button" onclick="togglePassVisibility('login-pass')">👁</button>
      </div>
      <button type="submit">Entrar</button>
      <a onclick="switchToRegister()">Novo por aqui? Registre-se</a>
    </form>
    
    <!-- REGISTER FORM -->
    <form class="login-form" id="register-form" onsubmit="handleRegister(event)">
      <div class="login-sub">Criar nova conta</div>
      <input type="text" id="reg-name" placeholder="Seu nome completo" required>
      <input type="text" id="reg-user" placeholder="Nome de usuário" required>
      <div class="pass-toggle">
        <input type="password" id="reg-pass" placeholder="Crie uma senha" required>
        <button type="button" onclick="togglePassVisibility('reg-pass')">👁</button>
      </div>
      <input type="text" id="reg-role" placeholder="Cargo/função" required>
      <button type="submit">Registrar</button>
      <a onclick="switchToLogin()">Já tem conta? Entrar</a>
    </form>
  </div>
</div>

<!-- APP INTERFACE (HIDDEN UNTIL LOGIN) -->
<div id="app-interface" style="display:none;">

<div class="header">
  <div class="header-inner">
    <div class="header-logo">
      <div class="logo-box">🏛</div>
      <div class="header-text">
        <strong>TORRINHA SP</strong>
        <small id="header-user">Usuário</small>
      </div>
    </div>
    <div class="header-actions">
      <button class="hbtn" id="btn-admin" onclick="showTab('admin')" title="Admin" style="display:none;">⚙️</button>
      <button class="hbtn" onclick="showTab('chat')">💬<span class="badge-num" id="badge-chat">0</span></button>
      <button class="hbtn" onclick="logout()" title="Sair">🚪</button>
    </div>
  </div>
</div>

<div class="tabs-wrap">
  <div class="tabs-inner">
    <button class="tab-btn active" id="tab-inicio" onclick="showTab('inicio')"><span class="ti">🏠</span>Início</button>
    <button class="tab-btn" id="tab-obras" onclick="showTab('obras')"><span class="ti">🔧</span>Obras</button>
    <button class="tab-btn" id="tab-chat" onclick="showTab('chat')"><span class="ti">💬</span>Chat<span class="tab-badge" id="badge-chat-tab" style="display:none">0</span></button>
    <button class="tab-btn" id="tab-admin" onclick="showTab('admin')" style="display:none;"><span class="ti">⚙️</span>Admin</button>
  </div>
</div>

<div class="main">
  <!-- INÍCIO -->
  <div class="panel active" id="panel-inicio">
    <div class="summary">
      <div class="sum-card"><div class="sum-num" id="sum-obras">0</div><div class="sum-label">Obras</div></div>
      <div class="sum-card"><div class="sum-num" id="sum-users">0</div><div class="sum-label">Usuários</div></div>
      <div class="sum-card"><div class="sum-num" id="sum-msgs">0</div><div class="sum-label">Mensagens</div></div>
    </div>
    <div class="sec-head"><span class="sec-title">Bem-vindo(a)</span></div>
    <div id="home-content" style="padding:20px;text-align:center;"></div>
  </div>

  <!-- OBRAS -->
  <div class="panel" id="panel-obras">
    <div style="padding:16px;">
      <p style="color:var(--text2);text-align:center;">Módulo de obras em desenvolvimento...</p>
    </div>
  </div>

  <!-- CHAT -->
  <div class="panel" id="panel-chat">
    <div class="chat-wrap">
      <div class="chat-messages" id="chat-messages"></div>
      <div class="chat-input-bar">
        <textarea class="chat-input" id="chat-input" placeholder="Escreva uma mensagem..." rows="1" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChat();}"></textarea>
        <button class="chat-audio-btn" id="audio-btn" onclick="toggleAudioRecord()" title="Gravar áudio" type="button">🎤</button>
        <button class="chat-send" onclick="sendChat()" type="button">➤</button>
      </div>
    </div>
  </div>

  <!-- ADMIN -->
  <div class="panel" id="panel-admin">
    <div style="padding:16px;">
      <div class="sec-head"><span class="sec-title">Gerenciar Usuários</span></div>
      <div id="users-list" style="display:flex;flex-direction:column;gap:10px;"></div>
    </div>
  </div>
</div>

</div><!-- end app-interface -->

<div id="toast"></div>

<script>
const esc = s => String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const uid = () => Date.now() + Math.floor(Math.random()*9999);
const today = () => new Date().toISOString().split('T')[0];
const fmtTime = d => new Date(d).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});

let toastTimer;
function showToast(msg, dur=3000) {
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'), dur);
}

function load(key,def){ try{ return JSON.parse(localStorage.getItem(key)||JSON.stringify(def)); }catch(e){ return def; } }
function save(key,val){ localStorage.setItem(key,JSON.stringify(val)); }

// ═══════════════════════════════════════════
// USERS & AUTH
// ═══════════════════════════════════════════
let users = load('ccb_users',[
  {id:1,name:'Admin',username:'admin',password:'admin123',role:'Administrador',isAdmin:true,created:today()}
]);
let currentUser = null;
let msgs = load('ccb_messages',[]);
let obras = load('ccb_obras',[]);
let audioChunks = [];
let mediaRecorder = null;
let isRecording = false;

function togglePassVisibility(inputId){
  const inp = document.getElementById(inputId);
  if(inp.type === 'password'){
    inp.type = 'text';
  } else {
    inp.type = 'password';
  }
}

function switchToLogin(){
  document.getElementById('login-form').classList.add('active');
  document.getElementById('register-form').classList.remove('active');
}

function switchToRegister(){
  document.getElementById('login-form').classList.remove('active');
  document.getElementById('register-form').classList.add('active');
}

function handleLogin(e){
  e.preventDefault();
  const user = document.getElementById('login-user').value.trim();
  const pass = document.getElementById('login-pass').value.trim();
  
  if(!user || !pass){ showToast('⚠️ Preencha todos os campos'); return; }
  
  const found = users.find(u=>u.username===user&&u.password===pass);
  if(!found){ showToast('❌ Usuário ou senha incorretos'); return; }
  
  currentUser = found;
  save('ccb_current_user', currentUser);
  loginSuccess();
}

function handleRegister(e){
  e.preventDefault();
  const name = document.getElementById('reg-name').value.trim();
  const user = document.getElementById('reg-user').value.trim();
  const pass = document.getElementById('reg-pass').value.trim();
  const role = document.getElementById('reg-role').value.trim();
  
  if(!name||!user||!pass||!role){ showToast('⚠️ Preencha todos os campos'); return; }
  if(users.find(u=>u.username===user)){ showToast('❌ Este usuário já existe'); return; }
  
  const newUser = {
    id: Math.max(...users.map(u=>u.id||0),0)+1,
    name,username:user,password:pass,role,
    isAdmin:false,created:today()
  };
  users.push(newUser);
  save('ccb_users',users);
  
  currentUser = newUser;
  save('ccb_current_user', currentUser);
  showToast('✅ Usuário criado com sucesso!');
  loginSuccess();
}

function loginSuccess(){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app-interface').style.display='block';
  document.getElementById('header-user').textContent=currentUser.name+' ('+currentUser.role+')';
  if(currentUser.isAdmin) document.getElementById('btn-admin').style.display='flex';
  showTab('inicio');
  renderInicio();
}

function logout(){
  if(!confirm('Sair da conta?')) return;
  currentUser = null;
  localStorage.removeItem('ccb_current_user');
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('app-interface').style.display='none';
  document.getElementById('login-user').value='';
  document.getElementById('login-pass').value='';
  document.getElementById('btn-admin').style.display='none';
  showToast('👋 Desconectado');
}

// ═══════════════════════════════════════════
// TABS
// ═══════════════════════════════════════════
let currentTab = 'inicio';
function showTab(tab) {
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  const panel = document.getElementById('panel-'+tab);
  const btn = document.getElementById('tab-'+tab);
  if(panel) panel.classList.add('active');
  if(btn) btn.classList.add('active');
  currentTab = tab;
  if(tab==='inicio') renderInicio();
  if(tab==='chat') renderChat();
  if(tab==='admin') renderAdmin();
}

// ═══════════════════════════════════════════
// INÍCIO
// ═══════════════════════════════════════════
function renderInicio(){
  document.getElementById('sum-obras').textContent = obras.length;
  document.getElementById('sum-users').textContent = users.length;
  document.getElementById('sum-msgs').textContent = msgs.length;
  
  const welcome = `👋 Bem-vindo(a), <strong>${esc(currentUser.name)}</strong>!<br>
    <small style="color:var(--text3);display:block;margin-top:8px;">Você está logado como <strong>${esc(currentUser.role)}</strong><br>
    Última atualização: ${new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</small>`;
  document.getElementById('home-content').innerHTML = welcome;
}

// ═══════════════════════════════════════════
// CHAT
// ═══════════════════════════════════════════
function renderChat(){
  const el = document.getElementById('chat-messages');
  if(!el) return;
  
  const sorted = [...msgs].sort((a,b)=>a.time-b.time);
  let lastDay = '', html = '';
  
  sorted.forEach(m=>{
    const d = new Date(m.time);
    const day = d.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'short'});
    if(day !== lastDay){ html += `<div class="chat-day-sep"><span>${day}</span></div>`; lastDay = day; }
    
    const mine = m.userId === currentUser.id;
    const timeStr = fmtTime(m.time);
    const sender = users.find(u=>u.id===m.userId)?.name||'Desconhecido';
    
    let bubble = '';
    if(m.type==='text'){
      bubble = `<div class="chat-bubble">
        ${!mine?`<div class="chat-sender">${esc(sender)}</div>`:''}
        <div class="chat-text">${esc(m.content)}</div>
        <div class="chat-time">${timeStr}</div>
      </div>`;
    } else if(m.type==='audio'){
      const duration = m.duration||'0:00';
      bubble = `<div class="chat-bubble">
        ${!mine?`<div class="chat-sender">${esc(sender)}</div>`:''}
        <div class="audio-msg">
          <button class="audio-play" onclick="playAudio('${m.audioId}')" type="button">▶</button>
          <div class="audio-info">
            <div style="font-size:11px;font-weight:700;">🎙 Áudio</div>
            <div class="audio-duration">${duration}</div>
          </div>
        </div>
        <div class="chat-time">${timeStr}</div>
      </div>`;
    }
    
    html += `<div class="chat-msg ${mine?'mine':''}">
      ${!mine?`<div class="chat-avatar">${sender[0]?.toUpperCase()}</div>`:''}
      ${bubble}
    </div>`;
  });
  
  el.innerHTML = html || '<div class="empty" style="padding:30px"><p>Nenhuma mensagem ainda.</p></div>';
  setTimeout(()=>el.scrollTop=el.scrollHeight, 50);
}

function sendChat(){
  const text = document.getElementById('chat-input').value.trim();
  if(!text) return;
  
  msgs.push({
    id:uid(),
    userId:currentUser.id,
    type:'text',
    content:text,
    time:Date.now()
  });
  
  save('ccb_messages',msgs);
  document.getElementById('chat-input').value='';
  renderChat();
}

// ─── AUDIO RECORDING ───
function toggleAudioRecord(){
  const btn = document.getElementById('audio-btn');
  
  if(!isRecording){
    startAudioRecord();
    btn.classList.add('recording');
    btn.textContent = '⏹';
  } else {
    stopAudioRecord();
    btn.classList.remove('recording');
    btn.textContent = '🎤';
  }
}

async function startAudioRecord(){
  try {
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    mediaRecorder = new MediaRecorder(stream);
    audioChunks = [];
    
    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
    mediaRecorder.onstop = () => finishAudioRecord(stream);
    
    mediaRecorder.start();
    isRecording = true;
    showToast('🎙 Gravando...');
  } catch(err){
    showToast('❌ Microfone não disponível');
  }
}

function stopAudioRecord(){
  if(mediaRecorder) mediaRecorder.stop();
  isRecording = false;
}

function finishAudioRecord(stream){
  stream.getTracks().forEach(t=>t.stop());
  
  const blob = new Blob(audioChunks, {type:'audio/wav'});
  const reader = new FileReader();
  
  reader.onload = e => {
    const audioData = e.target.result;
    const duration = '0:' + Math.ceil(audioChunks.length/10).toString().padStart(2,'0');
    
    msgs.push({
      id:uid(),
      userId:currentUser.id,
      type:'audio',
      audioId:'audio_'+uid(),
      audioData,
      duration,
      time:Date.now()
    });
    
    save('ccb_messages',msgs);
    renderChat();
    showToast('✅ Áudio enviado');
  };
  
  reader.readAsDataURL(blob);
}

function playAudio(audioId){
  const msg = msgs.find(m=>m.audioId===audioId);
  if(!msg || !msg.audioData) return;
  
  const audio = new Audio(msg.audioData);
  audio.play().catch(e=>console.error('Erro ao reproduzir:',e));
}

// ═══════════════════════════════════════════
// ADMIN
// ═══════════════════════════════════════════
function renderAdmin(){
  if(!currentUser.isAdmin){ showToast('❌ Acesso negado'); showTab('inicio'); return; }
  
  const el = document.getElementById('users-list');
  el.innerHTML = users.map(u=>`
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;">
      <div style="flex:1;">
        <div style="font-size:14px;font-weight:700;">${esc(u.name)}</div>
        <div style="font-size:12px;color:var(--text3);margin-top:3px;">@${esc(u.username)} · ${esc(u.role)} ${u.isAdmin?'👑':''}</div>
      </div>
      <div style="display:flex;gap:6px;">
        <button class="btn btn-secondary btn-sm" onclick="editUser(${u.id})" type="button">✏️</button>
        ${u.id!==currentUser.id?`<button class="btn btn-danger btn-sm" onclick="deleteUser(${u.id})" type="button">🗑️</button>`:''}
      </div>
    </div>
  `).join('');
}

function editUser(id){
  const u = users.find(x=>x.id===id);
  if(!u) return;
  
  const newRole = prompt('Novo cargo:', u.role);
  if(!newRole) return;
  
  u.role = newRole;
  save('ccb_users',users);
  renderAdmin();
  showToast('✅ Usuário atualizado');
}

function deleteUser(id){
  if(!confirm('Remover este usuário?')) return;
  users = users.filter(u=>u.id!==id);
  save('ccb_users',users);
  renderAdmin();
  showToast('🗑️ Usuário removido');
}
